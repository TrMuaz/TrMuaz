<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canva Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f9;
      font-family: Arial, sans-serif;
    }

    .viewer {
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    .viewer iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <main class="viewer">
    <iframe
      src="https://canva.link/kfrl3acvxarjgdcE"
      title="Canva design"
      allow="fullscreen"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
